  <!-- 구분선 -->
  <rect x="108" y="420" width="620" height="1" fill="#e8e3d8"/>

  <!-- 하단 태그라인 -->
  <text x="108" y="468" font-size="22" fill="#9e9585" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">무료 · 광고 없음 · 개인정보 수집 없음</text>

