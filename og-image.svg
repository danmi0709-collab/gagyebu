<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f3"/>
      <stop offset="100%" style="stop-color:#f0ebe0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c07a3a"/>
      <stop offset="100%" style="stop-color:#e2a45a"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 상단 장식선 -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- 왼쪽 장식 원 (배경) -->
  <circle cx="120" cy="500" r="300" fill="#e8e3d8" opacity="0.4"/>
  <circle cx="1100" cy="150" r="200" fill="#e8e3d8" opacity="0.3"/>

  <!-- 중앙 카드 영역 -->
  <rect x="80" y="60" width="680" height="510" rx="24" fill="#ffffff" opacity="0.85"/>

  <!-- 카드 왼쪽 상단 아이콘 배경 -->
  <rect x="108" y="100" width="72" height="72" rx="16" fill="#fff8ee"/>
  <!-- 💰 아이콘 대체 텍스트 -->
  <text x="144" y="152" font-size="44" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">💰</text>

  <!-- 메인 타이틀 -->
