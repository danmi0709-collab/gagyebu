  <text x="108" y="262" font-size="26" fill="#7a7468" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">설치 없이, 데이터는 내 기기에만 저장</text>

  <!-- 기능 칩들 -->
  <!-- 칩1: 수입·지출 -->
  <rect x="108" y="298" width="178" height="44" rx="22" fill="#f0f7f4"/>
  <text x="197" y="326" font-size="20" font-weight="700" fill="#2e7d4f" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">📋 내역 기록</text>

  <!-- 칩2: 분석 -->
  <rect x="298" y="298" width="154" height="44" rx="22" fill="#fff8ee"/>
  <text x="375" y="326" font-size="20" font-weight="700" fill="#c07a3a" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">📊 분석</text>

  <!-- 칩3: 자산 -->
