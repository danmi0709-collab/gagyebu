  <text x="208" y="526" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">지금 시작하기 →</text>

  <!-- 오른쪽 장식 영역 - 미니 앱 화면 -->
  <rect x="820" y="80" width="300" height="480" rx="20" fill="#ffffff" opacity="0.7"/>
  <rect x="820" y="80" width="300" height="10" rx="5" fill="url(#accent)"/>

