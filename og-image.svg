  <text x="850" y="332" font-size="14" fill="#2d2a24" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">급여</text>
  <text x="1090" y="332" font-size="14" font-weight="700" fill="#2e7d4f" text-anchor="end" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">+3,500,000</text>

  <rect x="840" y="346" width="260" height="1" fill="#e8e3d8"/>
  <text x="850" y="374" font-size="14" fill="#2d2a24" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">적금</text>
  <text x="1090" y="374" font-size="14" font-weight="700" fill="#2471a3" text-anchor="end" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">−400,000</text>

