  <!-- 칩4: 구독 -->
  <rect x="108" y="356" width="154" height="44" rx="22" fill="#fdf0ef"/>
  <text x="185" y="384" font-size="20" font-weight="700" fill="#c0392b" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">🔄 구독</text>

