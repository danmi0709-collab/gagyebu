  <rect x="840" y="396" width="260" height="1" fill="#e8e3d8"/>
  <text x="850" y="424" font-size="13" fill="#9e9585" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">🎯 순자산 목표 67%</text>
  <rect x="850" y="432" width="240" height="8" rx="4" fill="#f4f1eb"/>
  <rect x="850" y="432" width="161" height="8" rx="4" fill="#c07a3a"/>

  <!-- 하단 탭바 미니 -->
  <rect x="820" y="520" width="300" height="40" rx="0" fill="#f4f1eb" opacity="0.9"/>
  <text x="858" y="545" font-size="11" fill="#9e9585" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">내역</text>
  <text x="906" y="545" font-size="11" fill="#9e9585" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">분석</text>
  <text x="970" y="545" font-size="11" fill="#c07a3a" font-weight="700" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">카테고리</text>
  <text x="1034" y="545" font-size="11" fill="#9e9585" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">연예산</text>
  <text x="1082" y="545" font-size="11" fill="#9e9585" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">자산</text>

  <!-- 하단 출처 -->
  <text x="600" y="606" font-size="18" fill="#b5ae9f" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">danmi0709-collab.github.io/gagyebu/share</text>
</svg>
