  <text x="850" y="290" font-size="14" fill="#2d2a24" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">점심 식사</text>
  <text x="1090" y="290" font-size="14" font-weight="700" fill="#c0392b" text-anchor="end" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">−12,000</text>

