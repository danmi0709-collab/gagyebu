<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>꼬마 의사 병원</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8505b">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꼬마 병원">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3e6; --bg2:#fffaf0; --ink:#2b2b3a; --card:#ffffff;
  --red:#e8505b; --blue:#3a7bd5; --green:#2e9e4f; --yellow:#ffc400; --mint:#d8f5ec;
  --shadow:0 6px 0 rgba(0,0,0,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;height:100%;background:var(--bg2)}
body{margin:0;min-height:100%;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none;color:var(--ink)}
.screen{display:none;max-width:760px;margin:0 auto;padding:12px 16px 40px;min-height:100vh}
.screen.on{display:block}
h1{font-size:36px;text-align:center;margin:10px 0 4px;color:var(--red);text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(0,0,0,.12);line-height:1.2}
h2{font-size:26px;margin:4px 0 10px;text-align:center;color:var(--red)}
.sub{text-align:center;font-size:18px;margin:0 0 14px;color:#666}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-size:22px;padding:14px 20px;border-radius:18px;background:#fff;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.big{font-size:27px;padding:18px 22px;flex:1;min-width:220px}
.btn.red{background:var(--red);color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.2)}
.btn.small{font-size:17px;padding:9px 14px;border-radius:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.12)}

/* 첫 화면 */
.building{font-size:110px;text-align:center;line-height:1;margin:6px 0}
.namebox{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 16px;font-size:21px}
.namebox input{font-family:inherit;font-size:22px;padding:8px 12px;border-radius:12px;border:3px solid #ffb3b8;width:140px;text-align:center}
.badge{background:rgba(255,255,255,.8);border-radius:20px;padding:12px;margin:14px 0;text-align:center;font-size:20px;line-height:1.5}
.badge b{color:var(--red);font-size:24px}

/* 대기실 */
.waits{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.wcard{background:#fff;border-radius:22px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);position:relative;font-size:19px;line-height:1.35}
.wcard .ani{font-size:70px;line-height:1;display:block}
.wcard .mood{position:absolute;top:10px;right:14px;font-size:34px}
.wcard .sym{display:inline-block;margin-top:6px;background:var(--bg1);border-radius:12px;padding:4px 10px;color:#c03a44}
.wcard:active{transform:translateY(4px)}
.bench{height:16px;background:#c98b55;border-radius:8px;margin:10px 0 0;box-shadow:0 4px 0 #8a5a30}

/* 진료실 */
.say{background:#fff;border-radius:20px;padding:12px 14px;font-size:21px;line-height:1.4;box-shadow:0 4px 0 rgba(0,0,0,.1);position:relative;min-height:58px;text-align:center}
.say:after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:14px solid #fff;border-bottom:0}
.room{position:relative;margin:18px auto 6px;width:260px;height:372px}
.bed{position:absolute;left:-18px;right:-18px;top:30px;bottom:-4px;background:#fff;border-radius:30px 30px 14px 14px;box-shadow:inset 0 -10px 0 #e9eef5,0 6px 0 rgba(0,0,0,.12)}
.pillow{position:absolute;left:50%;top:14px;width:170px;height:70px;margin-left:-85px;background:#eef6ff;border-radius:40px;box-shadow:0 3px 0 #cfe0f3}
.fig{position:absolute;inset:0}
.head{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:118px;line-height:1;z-index:2}
.moodbadge{position:absolute;right:-6px;top:0;font-size:46px;z-index:4;background:#fff;border-radius:50%;width:66px;height:66px;line-height:66px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.body{position:absolute;left:10px;top:126px;width:240px;height:246px;z-index:1}
.spot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:5;display:flex;align-items:center;justify-content:center;font-size:40px;pointer-events:none}
.spot.heat{background:radial-gradient(circle,rgba(255,60,60,.65),rgba(255,60,60,0) 70%);animation:pulse 1s infinite}
.spot.heat:after{content:"♨️";font-size:30px;position:absolute;top:-26px}
.spot.cool:after{content:"🧊";font-size:44px}
.spot.scrape{background:radial-gradient(circle at 45% 50%,#d61f2c 0 30%,#ff7b84 42%,rgba(255,123,132,0) 62%)}
.spot.clean{background:radial-gradient(circle,#ffb3b8 0 34%,rgba(255,179,184,0) 60%)}
.spot.clean:after{content:"✨";font-size:30px}
.spot.bandaid:after{content:"";width:62px;height:26px;border-radius:13px;transform:rotate(-12deg);
  background:radial-gradient(circle at 50% 50%,#f6e0c5 0 9px,transparent 10px),#e7b98b;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.spot.germ:after{content:"🦠";font-size:34px;animation:wob .8s infinite}
.spot.germ:before{content:"🦠";font-size:24px;position:absolute;left:4px;top:2px;animation:wob .8s infinite reverse}
.spot.tooth:after{content:"🦷";font-size:30px;filter:sepia(1) saturate(2) hue-rotate(-20deg);animation:wob .8s infinite}
.spot.sparkle:after{content:"✨";font-size:34px}
.spot.bruise{background:radial-gradient(circle,#8e44ad 0 22%,rgba(142,68,173,.5) 40%,rgba(142,68,173,0) 62%)}
.spot.cast:after{content:"";width:40px;height:84px;border-radius:12px;background:repeating-linear-gradient(170deg,#fff 0 10px,#e8e8e8 10px 12px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.spot.splinter:after{content:"";width:6px;height:30px;background:#7a4a1c;border-radius:3px;transform:rotate(35deg);box-shadow:0 0 0 6px rgba(255,80,80,.35)}
.spot.snot:after{content:"💧";font-size:26px;animation:drip 1.2s infinite}
.spot.bump{background:radial-gradient(circle,#ff6b7a 0 22%,#ffb3bb 36%,rgba(255,179,187,0) 60%)}
.spot.bump:before{content:"💫";font-size:28px;position:absolute;top:-24px;animation:spin 2s linear infinite}
.spot.target{pointer-events:auto;cursor:pointer}
.spot.target:before{content:"";position:absolute;inset:-14px;border:5px dashed var(--red);border-radius:50%;animation:spin 4s linear infinite;z-index:-1}
.tapme{position:absolute;z-index:6;font-size:18px;background:var(--red);color:#fff;padding:4px 10px;border-radius:12px;white-space:nowrap;transform:translate(-50%,0);pointer-events:none;animation:hop 1s infinite}
.usetool{position:absolute;z-index:7;font-size:58px;margin:-30px 0 0 -30px;pointer-events:none;animation:usetool 1s ease}
.pop{position:absolute;left:50%;top:150px;transform:translate(-50%,-50%) scale(.6);background:#fff;border:4px solid var(--red);border-radius:20px;padding:10px 16px;font-size:22px;text-align:center;z-index:9;opacity:0;pointer-events:none;transition:all .25s;min-width:180px;line-height:1.35}
.pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pop svg{display:block;margin:4px auto 0}

.hintbar{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px 0 6px}
.steps{display:flex;gap:6px}
.steps i{width:16px;height:16px;border-radius:50%;background:#ffd0d4;display:block}
.steps i.done{background:var(--green)}
.steps i.now{background:var(--red);animation:pulse 1s infinite}
.hint{font-size:20px;text-align:center;color:#b0303b;min-height:28px;line-height:1.35}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#fff7e6;border-radius:22px;padding:10px;box-shadow:inset 0 0 0 4px #ffe0a8;margin-top:8px}
.tool{background:#fff;border-radius:16px;padding:6px 2px 4px;box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;line-height:1.1;min-height:76px;justify-content:center}
.tool .e{font-size:34px;line-height:1.1;display:flex;align-items:center;justify-content:center;height:40px}
.tool.sel{background:#ffe066;transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.tool.glow{animation:glow 1s infinite}
.tool.no{animation:shake .4s}
.speak{background:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.12)}

/* 다 나았어요 */
.over{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.over.on{display:flex}
.card{background:#fff;border-radius:26px;padding:22px 18px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.card .big{font-size:96px;line-height:1}
.card p{font-size:21px;margin:10px 0;line-height:1.45}
.sticker{display:inline-block;background:var(--mint);border:4px dashed #5cc9a7;border-radius:50%;width:110px;height:110px;line-height:100px;font-size:64px;animation:pop .6s ease}

/* 스티커북 */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.bk{text-align:center;font-size:15px;line-height:1.3}
.bk .s{display:block;width:78px;height:78px;margin:0 auto 4px;border-radius:50%;background:var(--mint);border:3px dashed #5cc9a7;font-size:46px;line-height:72px;position:relative}
.bk.off .s{background:#eee;border-color:#ccc;filter:grayscale(1);opacity:.35}
.bk .n{position:absolute;right:-6px;bottom:-4px;background:var(--red);color:#fff;font-size:15px;line-height:1;padding:4px 7px;border-radius:12px}
.fall{position:fixed;top:-60px;font-size:36px;z-index:40;pointer-events:none;animation:fall 2.2s linear forwards}

/* 새 아픈 곳 모습 */
.spot.eyered{background:radial-gradient(circle,rgba(255,70,70,.55) 0 22%,rgba(255,70,70,0) 52%)}
.spot.eyered:after{content:"";width:7px;height:7px;border-radius:50%;background:#6b4a2a;animation:wob .8s infinite}
.spot.sting{background:radial-gradient(circle,#ff5c6c 0 20%,#ffb0b8 38%,rgba(255,176,184,0) 60%)}
.spot.sting:after{content:"";width:3px;height:14px;background:#222;border-radius:2px;transform:rotate(20deg)}
.spot.swell{background:radial-gradient(circle,#ff8f9b 0 24%,#ffc4ca 40%,rgba(255,196,202,0) 62%)}
.spot.burn{background:radial-gradient(circle,#ff3b1f 0 22%,#ff9b6b 40%,rgba(255,155,107,0) 62%);animation:pulse 1s infinite}
.spot.wet:after{content:"💦";font-size:34px;animation:wob .8s infinite}
.spot.cream{background:radial-gradient(circle,#fff 0 26%,rgba(255,255,255,.7) 40%,rgba(255,255,255,0) 60%)}
.spot.cream:after{content:"✨";font-size:22px}
.spot.blood:after{content:"🩸";font-size:22px;position:absolute;top:34px;animation:drip 1.2s infinite}
.spot.hiccup:after{content:"딸꾹!";font-size:20px;color:#e8505b;background:#fff;border-radius:12px;padding:2px 8px;animation:wob .5s infinite}
.spot.itch{background:radial-gradient(circle at 35% 40%,#ff7f8f 0 10%,transparent 18%),radial-gradient(circle at 65% 60%,#ff7f8f 0 10%,transparent 18%),radial-gradient(circle,rgba(255,150,160,.5) 0 30%,transparent 60%)}
.spot.itch:before{content:"🦟";font-size:22px;position:absolute;top:-24px;right:-4px;animation:wob .4s infinite}

/* 우리 병원 로비 */
.lobby{position:relative;width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);container-type:inline-size;background:#fff}
.lobby.mini{aspect-ratio:2/1;margin-bottom:12px}
.lobby .wall{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(#fff3d6,#ffe9c2)}
.lobby .wall.rainbow{background:linear-gradient(180deg,#ffd6d6,#ffe9c7,#fff8c2,#d9f7c9,#cfe8ff,#e6d8ff)}
.lobby .wall.stars{background:radial-gradient(circle at 20% 30%,#fff 0 2%,transparent 3%),radial-gradient(circle at 70% 20%,#fff 0 2%,transparent 3%),radial-gradient(circle at 45% 60%,#fff 0 1.5%,transparent 2.5%),radial-gradient(circle at 85% 55%,#fff 0 2%,transparent 3%),linear-gradient(#2c3e8f,#5b6fd1)}
.lobby .wall.mint{background:repeating-linear-gradient(90deg,#d8f5ec 0 6%,#c3efe0 6% 12%)}
.lobby .floor{position:absolute;left:0;right:0;bottom:0;height:38%;background:repeating-conic-gradient(#f6d9b8 0 25%,#ecc79f 0 50%) 0 0/12cqw 12cqw}
.lobby .floor.grass{background:linear-gradient(#a6e27a,#7fcf55)}
.lobby .floor.blue{background:repeating-conic-gradient(#cfe8ff 0 25%,#b4d8ff 0 50%) 0 0/12cqw 12cqw}
.lobby .sign{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:4.2cqw;padding:.6cqw 3cqw;border-radius:3cqw;white-space:nowrap;z-index:2}
.lobby .desk{position:absolute;left:36%;width:28%;top:48%;height:20%;background:#fff;border-radius:2cqw 2cqw 0 0;box-shadow:inset 0 -2cqw 0 #ffd0d4;z-index:3;font-size:3.4cqw;text-align:center;padding-top:7%;color:#c03a44}
.lobby .doc{position:absolute;left:50%;top:33%;transform:translateX(-50%);font-size:12cqw;line-height:1;z-index:2}
.lobby .it{position:absolute;line-height:1;z-index:4;transform:translate(-50%,-50%)}
.lobby .it.fish{background:rgba(140,210,255,.75);border:1cqw solid #fff;border-radius:2cqw;padding:1cqw 2cqw;font-size:5cqw;white-space:nowrap}
.lobby .it.bob{animation:bob 2s ease-in-out infinite}
.lobby .empty{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:3.6cqw;color:#9a7b5a;z-index:5}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.shopit{background:#fff;border-radius:18px;padding:10px 4px;text-align:center;box-shadow:var(--shadow);font-size:16px;line-height:1.3}
.shopit .e{font-size:40px;display:block;line-height:1.2}
.shopit .price{display:inline-block;margin-top:4px;background:#fff3c4;border-radius:10px;padding:2px 8px}
.shopit.own{background:var(--mint)}
.shopit.own .price{background:#fff}
.shopit.off{opacity:.55}
.shopit.cant .price{color:#aaa}
.shoptabs{display:flex;gap:8px;justify-content:center;margin-top:12px}
.shoptabs .btn.on{background:var(--red);color:#fff}

/* 응급 전화 카드 */
.emcard{display:block;width:100%;background:#fff;border:5px solid var(--red);border-radius:22px;padding:12px;margin-bottom:12px;font-size:21px;line-height:1.4;box-shadow:var(--shadow);animation:alarm 1s infinite}
.emcard .ani{font-size:54px;line-height:1;display:block}
@keyframes alarm{50%{border-color:#3a7bd5}}

/* 구급차 출동 */
#amb{position:fixed;inset:0;z-index:35;display:none;flex-direction:column;background:#bfe6ff}
#amb.on{display:flex}
#amb .say{margin:14px 16px 0}
#amb .street{position:relative;flex:1;background:linear-gradient(#bfe6ff 0 50%,#9fd77f 50% 58%,#555c66 58% 84%,#9fd77f 84%)}
#amb .bld{position:absolute;top:51%;font-size:58px;line-height:1;transform:translateY(-100%)}
#amb .lane{position:absolute;left:0;right:0;top:78%;height:6px;background:repeating-linear-gradient(90deg,#fff 0 30px,transparent 30px 60px)}
#amb .car{position:absolute;top:68%;left:4%;font-size:86px;line-height:1;transform:translateY(-50%);transition:left 3s ease-in-out;z-index:3}
#amb .car .face{display:inline-block}
#amb .car.right .face{transform:scaleX(-1)}
#amb .car .siren{position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:30px;animation:pulse .3s infinite}
#amb .car.drive .face{animation:rumble .25s infinite}
#amb .pt{position:absolute;top:50%;left:82%;font-size:64px;line-height:1;transform:translate(-50%,-50%);transition:all .8s ease;z-index:4;cursor:pointer}
#amb .pt .m{position:absolute;right:-20px;top:-20px;font-size:32px}
#amb .pt.in{left:var(--carx);transform:translate(-50%,-50%) scale(.2);opacity:0}
#amb .ptap{position:absolute;top:36%;left:76%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:18px;padding:4px 10px;border-radius:12px;white-space:nowrap;animation:hop 1s infinite;z-index:5}
#amb .ctrl{padding:14px 16px 24px;text-align:center}
@keyframes rumble{50%{transform:translateY(-3px)}}
#amb .car.right.drive .face{animation:rumbleR .25s infinite}
@keyframes rumbleR{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-3px)}}
@keyframes bob{50%{transform:translate(-50%,-62%)}}

@keyframes pulse{50%{opacity:.55}}
@keyframes wob{50%{transform:rotate(12deg) scale(1.1)}}
@keyframes drip{0%{transform:translateY(-6px)}100%{transform:translateY(10px);opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hop{50%{transform:translate(-50%,-6px)}}
.head.bounce{animation:hophead .5s ease 3}
@keyframes hophead{50%{transform:translateY(-16px)}}
@keyframes usetool{0%{transform:scale(.3) translateY(60px);opacity:0}30%{transform:scale(1.1);opacity:1}50%{transform:rotate(-14deg)}70%{transform:rotate(14deg)}100%{transform:rotate(0);opacity:0}}
@keyframes glow{50%{background:#ffe066;box-shadow:0 0 0 5px var(--red)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:380px){.tool{font-size:12px;min-height:70px}.tool .e{font-size:30px}.say{font-size:19px}}
</style>
</head>
<body>

<!-- 첫 화면 -->
<section class="screen on" id="home">
  <h1>꼬마 의사 병원</h1>
  <p class="sub">아픈 친구들이 기다리고 있어요!</p>
  <div class="building">🏥</div>
  <div class="namebox">
    <span>의사 이름</span><input id="docName" maxlength="6"><span>선생님</span>
  </div>
  <div class="row">
    <button class="btn big red" id="goWait">🩺 진료 시작</button>
  </div>
  <div class="badge" id="rank"></div>
  <div class="row">
    <button class="btn" id="goDeco">🏥 병원 꾸미기</button>
    <button class="btn" id="goBook">📒 스티커북</button>
    <button class="btn" id="voiceBtn">🔊 소리 켜짐</button>
  </div>
</section>

<!-- 대기실 -->
<section class="screen" id="wait">
  <div class="top">
    <button class="btn small" data-go="home">🏠 처음</button>
    <span class="pill" id="waitCount"></span>
  </div>
  <div class="lobby mini" id="miniLobby"></div>
  <div id="emSlot"></div>
  <h2>🪑 대기실</h2>
  <p class="sub">어떤 친구부터 치료해 줄까요? 눌러 보세요!</p>
  <div class="waits" id="waits"></div>
  <div class="bench"></div>
</section>

<!-- 진료실 -->
<section class="screen" id="treat">
  <div class="top">
    <button class="btn small" id="backWait">🪑 대기실</button>
    <span class="pill" id="patientName"></span>
  </div>
  <div class="say" id="say"></div>
  <div class="room">
    <div class="bed"><div class="pillow"></div></div>
    <div class="fig" id="fig"></div>
    <div class="pop" id="pop"></div>
  </div>
  <div class="hintbar">
    <div class="steps" id="steps"></div>
    <button class="speak" id="hearHint" aria-label="다시 듣기">🔊</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="tray" id="tray"></div>
</section>

<!-- 병원 꾸미기 -->

let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, dur, type = "sine", vol = .2, at = 0, slideTo) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .15, at = 0, freq = 1500) {
  const a = ac(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + at;
  s.buffer = b; f.type = "bandpass"; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  pick: () => tone(660, .08, "triangle", .15),
  ok: () => { tone(784, .12, "triangle"); tone(1046, .18, "triangle", .2, .1); },
  no: () => tone(220, .25, "square", .08, 0, 150),
  spray: () => { noise(.18, .2, 0, 3000); noise(.18, .2, .25, 3000); },
  beat: () => { for (let i = 0; i < 3; i++) { tone(70, .12, "sine", .5, i * .45); tone(60, .12, "sine", .4, i * .45 + .15); } },
  brush: () => { for (let i = 0; i < 6; i++) noise(.08, .15, i * .12, 4000); },
  camera: () => { noise(.06, .3, 0, 2500); tone(1500, .05, "square", .1, .05); },
  pop: () => tone(400, .12, "sine", .3, 0, 900),
  gurgle: () => { for (let i = 0; i < 5; i++) tone(120 + Math.random() * 80, .15, "sine", .3, i * .13, 60 + Math.random() * 60); },
  fart: () => { tone(110, .7, "sawtooth", .25, .2, 55); noise(.6, .1, .2, 200); },
  drop: () => { tone(1200, .08, "sine", .2, 0, 600); tone(1200, .08, "sine", .2, .3, 600); },
  hic: () => { tone(500, .1, "square", .1, 0, 900); tone(500, .1, "square", .1, .5, 900); },
  siren: () => { for (let i = 0; i < 4; i++) { tone(700, .35, "triangle", .12, i * .7, 950); tone(950, .35, "triangle", .12, i * .7 + .35, 700); } },
  buy: () => [880, 1175, 1568].forEach((f, i) => tone(f, .15, "triangle", .2, i * .08)),
  cheer: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, "triangle", .2, i * .12)),
};

function drawStep(read = true) {

function clearTarget() {
  const s = $("spot"); if (s) s.classList.remove("target");
  document.querySelectorAll(".tapme").forEach(e => e.remove());
}

function pickTool(id, btn) {
  if (!T || T.busy) return;
  const st = T.I.steps[T.step];
  if (id !== st.tool) {
    sfx("no");
    btn.classList.remove("no"); void btn.offsetWidth; btn.classList.add("no");
    const line = rand((WRONG[id] || []).concat(WRONG_ANY));
    setSay(line); speak(line);

    if (T.wrong >= 2) document.querySelector(`.tool[data-t="${st.tool}"]`).classList.add("glow");
    return;
  }
  sfx("pick");
  T.picked = id;
  document.querySelectorAll(".tool").forEach(b => b.classList.toggle("sel", b === btn));
  btn.classList.remove("glow");

});
function drawDeco() {
  $("decoStars").textContent = `⭐ 칭찬 스티커 ${S.stars}장`;
  drawLobby($("bigLobby"));
  const list = decoTab === "item" ? DECO : decoTab === "wall" ? WALLS : FLOORS;
  $("shop").innerHTML = Object.entries(list).map(([k, d]) => {
    let own, label;
    if (decoTab === "item") { own = S.own.includes(k); label = own ? (S.hide.includes(k) ? "넣어 둠" : "놓여 있음") : `⭐ ${d.price}`; }
    else { const cur = decoTab === "wall" ? S.wall : S.floor; own = !d.price || S.own.includes(decoTab + ":" + k); label = cur === k ? "쓰는 중" : own ? "바꾸기" : `⭐ ${d.price}`; }
    const off = decoTab === "item" && own && S.hide.includes(k);
    return `<button class="shopit ${own ? "own" : ""} ${off ? "off" : ""} ${!own && S.stars < d.price ? "cant" : ""}" data-k="${k}">
      <span class="e">${d.e.split(" ")[0]}</span>${d.name}<br><span class="price">${label}</span></button>`;
  }).join("");
  $("shop").querySelectorAll(".shopit").forEach(b => b.onclick = () => buy(b.dataset.k));
}
function buy(k) {
  const isItem = decoTab === "item", list = isItem ? DECO : decoTab === "wall" ? WALLS : FLOORS, d = list[k];
  const key = isItem ? k : decoTab + ":" + k, own = !d.price || S.own.includes(key);
  if (own) {
    sfx("pick");
    if (isItem) { S.hide = S.hide.includes(k) ? S.hide.filter(x => x !== k) : S.hide.concat(k); }
    else if (decoTab === "wall") S.wall = k; else S.floor = k;
  } else if (S.stars < d.price) {
    sfx("no");
    const need = d.price - S.stars;
    speak(`칭찬 스티커가 ${need}장 더 필요해요. 환자를 치료하면 받을 수 있어요!`);
    return;
  } else {
    S.stars -= d.price; S.own.push(key); sfx("buy");
    if (decoTab === "wall") S.wall = k; if (decoTab === "floor") S.floor = k;
    speak(`${jo(d.name, "을", "를")} 샀어요! 병원이 더 예뻐졌어요.`);
  }
  save(); drawDeco();
}

// ───────── 구급차 출동 ─────────
let AMB = null;
function ambSay(t) { $("ambSay").innerHTML = t; speak(t); }
function startAmb() {
  const p = S.emerg; if (!p) return;
  const A = ANIMALS[p.a], I = ILLS[p.i];
  AMB = { stage: "call" };
  sfx("siren");
  const car = $("car"); car.className = "car"; car.style.transition = "none"; car.style.left = "4%";
  $("ambPt").className = "pt"; $("ambPt").innerHTML = `${A.e}<span class="m">${I.mood}</span>`;
  $("street").querySelectorAll(".ptap").forEach(e => e.remove());
  $("ambBtn").style.display = ""; $("ambBtn").textContent = "🚑 출동!";
  $("amb").classList.add("on");
  ambSay(`🚨 응급 전화! "${jo(A.name, "이", "가")} ${I.sym}! 빨리 와 주세요!"`);
}
$("ambBtn").onclick = () => {
  if (!AMB || AMB.stage !== "call") return;
  AMB.stage = "go";
  $("ambBtn").style.display = "none";
  const car = $("car");
  void car.offsetWidth; car.style.transition = "";
  car.classList.add("right", "drive");
  car.style.left = "44%";
  sfx("siren");
  ambSay("삐뽀삐뽀! 길을 비켜 주세요~");
  setTimeout(() => {
    car.classList.remove("drive");
    AMB.stage = "pick";
    const tap = document.createElement("div"); tap.className = "ptap"; tap.textContent = "눌러서 태워요 👆";
    $("street").appendChild(tap);
    ambSay(`도착했어요! ${jo(ANIMALS[S.emerg.a].name, "을", "를")} 눌러서 구급차에 태워요.`);
  }, 3100);
};
$("ambPt").onclick = () => {
  if (!AMB || AMB.stage !== "pick") return;
  AMB.stage = "back";
  $("street").querySelectorAll(".ptap").forEach(e => e.remove());
  const pt = $("ambPt"), car = $("car");
  pt.style.setProperty("--carx", (parseFloat(car.style.left) + 10) + "%");
  pt.classList.add("in");
  sfx("pop");
  ambSay("조심조심 태웠어요. 병원으로 출발!");
  setTimeout(() => {
    car.classList.remove("right"); car.classList.add("drive");
    car.style.left = "4%";
    sfx("siren");
  }, 1100);
  setTimeout(() => {
    car.classList.remove("drive");
    ambSay("병원에 도착! 빨리 진료실로 가요!");
  }, 4200);
  setTimeout(() => {
    $("amb").classList.remove("on");
    AMB = null;
    startTreat("emerg");
  }, 5600);
};

// ───────── 스티커북 ─────────
function drawBook() {
  const got = Object.keys(ANIMALS).filter(k => S.stickers[k]).length;
  $("bookCount").textContent = `${got} / ${Object.keys(ANIMALS).length} 친구`;
  $("book").innerHTML = Object.entries(ANIMALS).map(([k, A]) => {
    const n = S.stickers[k] || 0;
    return `<div class="bk ${n ? "" : "off"}"><span class="s">${A.e}${n > 1 ? `<span class="n">×${n}</span>` : ""}</span>${n ? A.name : "?"}</div>`;
  }).join("");
}

drawHome();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
